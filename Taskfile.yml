version: "3"

vars:
  BIN_DIR: ./bin
  CLI_BIN: "{{.BIN_DIR}}/analyze-cli"

tasks:
  default:
    desc: Run lint and tests
    cmds:
      - task: lint
      - task: test

  build:
    desc: Build the CLI tool
    cmds:
      - go build -o {{.CLI_BIN}} ./cmd/analyze-cli/
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.CLI_BIN}}"

  test:
    desc: Run unit tests
    cmds:
      - go test -race -count=1 ./...

  test:integration:
    desc: Run integration tests (requires ONNX model + runtime)
    cmds:
      - go test -race -count=1 -tags=integration ./...

  test:cover:
    desc: Run tests with coverage report
    cmds:
      - go test -race -count=1 -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
    generates:
      - coverage.out

  test:cover:html:
    desc: Open coverage report in browser
    deps: [test:cover]
    cmds:
      - go tool cover -html=coverage.out

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  lint:fix:
    desc: Run golangci-lint with auto-fix
    cmds:
      - golangci-lint run --fix ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy and verify go.mod
    cmds:
      - go mod tidy
      - go mod verify

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BIN_DIR}}
      - rm -f coverage.out
